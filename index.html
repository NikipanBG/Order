<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АВТОЗОНА 33 - Професионална система</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .login-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .login-btn:hover {
            background: white;
            color: #667eea;
        }
        
        .main-content {
            padding: 30px;
        }
        
        /* Quick Add Section - НОВО */
        .quick-add-section {
            background: linear-gradient(135deg, #f5f7ff 0%, #eef2ff 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #667eea20;
        }
        
        .quick-add-title {
            font-size: 14px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quick-add-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .code-input-group {
            flex: 2;
            min-width: 250px;
            position: relative;
        }
        
        .code-input-group input {
            width: 100%;
            padding: 14px 20px;
            padding-left: 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        
        .code-input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .code-input-group::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #999;
        }
        
        .code-input-group .barcode-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #999;
            pointer-events: none;
        }
        
        .quantity-add-group {
            flex: 1;
            min-width: 120px;
        }
        
        .quantity-add-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
        }
        
        .quick-add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .quick-add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .batch-add-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
        }
        
        .batch-add-toggle {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .batch-textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
            display: none;
        }
        
        .batch-textarea.active {
            display: block;
        }
        
        .batch-actions {
            margin-top: 10px;
            display: none;
            gap: 10px;
        }
        
        .batch-actions.active {
            display: flex;
        }
        
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tool-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .tool-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .tool-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .tool-btn.secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .tool-btn.secondary:hover {
            background: #e0e0e0;
        }
        
        .status-badge {
            background: #4CAF50;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .search-box {
            flex: 2;
            min-width: 250px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            padding-left: 45px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #999;
        }
        
        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-group label {
            font-weight: bold;
            color: #555;
            min-width: 60px;
        }
        
        .filter-select {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            min-width: 180px;
            background: white;
            cursor: pointer;
        }
        
        .hide-zero-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .hide-zero-btn.active {
            background: #667eea;
            color: white;
        }
        
        .selected-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-left: auto;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .product-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        
        .product-card.selected {
            border: 2px solid #667eea;
            background: #f0f4ff;
        }
        
        .product-card.out-of-stock {
            opacity: 0.6;
            background: #f5f5f5;
        }
        
        .product-brand {
            color: #667eea;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            padding-right: 50px;
        }
        
        .product-code {
            font-size: 12px;
            color: #999;
            font-family: monospace;
            margin-bottom: 5px;
        }
        
        .product-group {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .product-stock {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .product-stock.low {
            background: #ffebee;
            color: #c62828;
        }
        
        .product-stock.medium {
            background: #fff3e0;
            color: #ef6c00;
        }
        
        .product-stock.high {
            background: #e8f5e8;
            color: #2e7d32;
        }
        
        .product-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }
        
        .add-btn {
            background: #4CAF50;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .add-btn:hover {
            background: #45a049;
            transform: scale(1.1);
        }
        
        .add-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .no-products {
            grid-column: 1/-1;
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 16px;
        }
        
        .cart-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .cart-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        .cart-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 16px;
        }
        
        .cart-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .cart-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .cart-item-info {
            flex: 1;
            min-width: 200px;
        }
        
        .cart-item-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .cart-item-info p {
            color: #666;
            font-size: 14px;
        }
        
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .quantity-input {
            width: 70px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        
        .quantity-btn {
            background: #f0f0f0;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .quantity-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        .remove-btn:hover {
            background: #cc0000;
        }
        
        .cart-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid #ddd;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .cart-total {
            font-size: 18px;
            font-weight: bold;
        }
        
        .cart-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .shortcuts-hint {
            background: #f0f0f0;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 12px;
            color: #666;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .shortcuts-hint kbd {
            background: #333;
            color: white;
            padding: 2px 8px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
        }
        
        @media (max-width: 768px) {
            .toolbar, .filters, .quick-add-row {
                flex-direction: column;
            }
            
            .products-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .frequent-products {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 12px;
        }
        
        .frequent-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .frequent-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .frequent-tag {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .frequent-tag:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">АВТОЗОНА 33</div>
            <div class="shortcuts-hint">
                <kbd>Ctrl</kbd>+<kbd>K</kbd> търсене | <kbd>Ctrl</kbd>+<kbd>B</kbd> код
            </div>
            <button class="login-btn" onclick="toggleLogin()">👤 ВЛИЗАНЕ</button>
        </div>
        
        <div class="main-content">
            <!-- НОВО: Бързо добавяне по код/баркод -->
            <div class="quick-add-section">
                <div class="quick-add-title">
                    ⚡ БЪРЗО ДОБАВЯНЕ ПО КОД / БАРКОД
                </div>
                <div class="quick-add-row">
                    <div class="code-input-group">
                        <input type="text" id="quickCodeInput" placeholder="Въведете или сканирайте код на продукт... (баркод/артикул)" autocomplete="off">
                        <span class="barcode-icon">📷</span>
                    </div>
                    <div class="quantity-add-group">
                        <input type="number" id="quickQuantity" value="1" min="1" max="999" placeholder="Брой">
                    </div>
                    <button class="quick-add-btn" onclick="addProductByCode()">
                        ➕ ДОБАВИ
                    </button>
                </div>
                
                <div class="batch-add-area">
                    <button class="batch-add-toggle" onclick="toggleBatchAdd()">
                        📋 + Масово добавяне (няколко кода наведнъж)
                    </button>
                    <textarea id="batchCodes" class="batch-textarea" rows="3" placeholder="Въведете кодове, всеки на нов ред или разделени със запетая&#10;Пример:&#10;BOS001, VAL002, HEL001&#10;или&#10;BOS001&#10;VAL002&#10;HEL001"></textarea>
                    <div class="batch-actions" id="batchActions">
                        <button class="tool-btn secondary" onclick="addBatchCodes()">➕ Добави всички</button>
                        <button class="tool-btn secondary" onclick="clearBatchArea()">🗑️ Изчисти</button>
                    </div>
                </div>
            </div>
            
            <div class="toolbar">
                <button class="tool-btn primary" onclick="loadProductsFromGoogleSheets()">
                    🔄 ОБНОВИ
                </button>
                <div class="status-badge" id="statusBadge">
                    ✓ Синхронизирано
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Търсене по марка, модел, група или код..." oninput="handleSearch()">
                </div>
                <button class="tool-btn secondary" onclick="showCartModal()">
                    📋 ПРЕГЛЕД НА ЗАЯВКАТА (<span id="cartCount">0</span>)
                </button>
                <button class="tool-btn secondary" onclick="showHistoryModal()">
                    📜 ИСТОРИЯ
                </button>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <label>Група:</label>
                    <select class="filter-select" id="groupFilter" onchange="filterProducts()">
                        <option value="all">Всички групи</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Марка:</label>
                    <select class="filter-select" id="brandFilter" onchange="filterProducts()">
                        <option value="all">Всички марки</option>
                    </select>
                </div>
                <button class="hide-zero-btn" id="hideZeroBtn" onclick="toggleHideZero()">
                    <span>👁️</span> Скрий нулевите
                </button>
                <div class="selected-count" id="selectedCount">
                    0 избрани
                </div>
            </div>
            
            <div class="stats-bar" id="statsBar">
                <div class="stats-item">
                    <span class="stats-label">Общо продукти:</span>
                    <span class="stats-value" id="totalProducts">0</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Показани:</span>
                    <span class="stats-value" id="shownProducts">0</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Налични:</span>
                    <span class="stats-value" id="inStockProducts">0</span>
                </div>
            </div>
            
            <!-- Често поръчвани продукти - НОВО -->
            <div class="frequent-products" id="frequentProducts" style="display: none;">
                <div class="frequent-title">⭐ ЧЕСТО ПОРЪЧВАНИ</div>
                <div class="frequent-list" id="frequentList"></div>
            </div>
            
            <div class="loading" id="loadingSpinner">
                <div class="spinner"></div>
                <p>Зареждане на продуктите...</p>
            </div>
            
            <div class="products-grid" id="productsGrid"></div>
            
            <div class="cart-panel">
                <div class="cart-header">
                    <div>
                        <span class="cart-title">КОЛИЧКА</span>
                        <span class="cart-count" id="cartPanelCount">0 бр.</span>
                    </div>
                    <div>
                        <button class="tool-btn secondary" onclick="clearCart()">🗑️ ИЗЧИСТИ</button>
                    </div>
                </div>
                
                <div class="cart-items" id="cartItems"></div>
                
                <div class="cart-footer">
                    <div class="cart-total" id="cartTotal">Общо: 0 бр.</div>
                    <div class="cart-actions">
                        <button class="tool-btn primary" onclick="printCart()">🖨️ ПЕЧАТ</button>
                        <button class="tool-btn primary" onclick="emailCart()">📧 ИМЕЙЛ</button>
                        <button class="tool-btn primary" onclick="viberCart()">💬 VIBER</button>
                        <button class="tool-btn primary" onclick="exportCart()">📊 EXCEL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Модални прозорци -->
    <div class="modal" id="cartModal">...</div>
    <div class="modal" id="historyModal">...</div>

    <script>
        // ==================== КОНФИГУРАЦИЯ ====================
        const GOOGLE_SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT-vUn0NhIFZHcJ0lLPcG8EdzIbdRPxQ5UPUSufkdvih5TiIrk7GHsdOZhF3Ne2l1n4zmBYa7nSf6c/pub?output=csv';
        
        // ==================== ГЛОБАЛНИ ПРОМЕНЛИВИ ====================
        let allProducts = [];
        let filteredProducts = [];
        let cart = [];
        let selectedProducts = new Set();
        let orders = JSON.parse(localStorage.getItem('orders') || '[]');
        let hideZeroStock = false;
        let searchTerm = '';
        let orderFrequency = JSON.parse(localStorage.getItem('orderFrequency') || '{}');
        
        // ==================== НОВА ФУНКЦИЯ: ДОБАВЯНЕ ПО КОД ====================
        function addProductByCode() {
            const codeInput = document.getElementById('quickCodeInput');
            const code = codeInput.value.trim().toUpperCase();
            const quantity = parseInt(document.getElementById('quickQuantity').value) || 1;
            
            if (!code) {
                showNotification('❌ Моля, въведете код на продукт');
                return;
            }
            
            // Търсене на продукт по код
            const product = allProducts.find(p => 
                p.code && p.code.toUpperCase() === code
            );
            
            if (!product) {
                showNotification(`❌ Не е намерен продукт с код: ${code}`);
                // Вибрация на полето при грешка
                codeInput.style.animation = 'shake 0.3s ease';
                setTimeout(() => { codeInput.style.animation = ''; }, 300);
                return;
            }
            
            if (product.stock === 0) {
                showNotification(`❌ ${product.brand} ${product.model} - Няма наличност`);
                return;
            }
            
            // Добавяне в количката
            const existingItem = cart.find(item => item.id === product.id);
            const maxStock = product.stock > 9 ? 999 : product.stock;
            const currentQuantity = existingItem ? existingItem.quantity : 0;
            const newQuantity = currentQuantity + quantity;
            
            if (newQuantity > maxStock) {
                showNotification(`⚠ Достигнахте максималната наличност (${formatStock(product.stock)}) за ${product.brand} ${product.model}`);
                return;
            }
            
            if (existingItem) {
                existingItem.quantity = newQuantity;
            } else {
                cart.push({
                    ...product,
                    quantity: quantity
                });
            }
            
            // Запазване на честота на поръчки
            orderFrequency[product.code] = (orderFrequency[product.code] || 0) + 1;
            localStorage.setItem('orderFrequency', JSON.stringify(orderFrequency));
            
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
            updateFrequentProducts();
            
            // Изчистване на полето за код и фокус върху него за следващо сканиране
            codeInput.value = '';
            codeInput.focus();
            
            showNotification(`✅ Добавен: ${product.brand} ${product.model} x${quantity}`);
        }
        
        // ==================== МАСОВО ДОБАВЯНЕ ====================
        function toggleBatchAdd() {
            const textarea = document.getElementById('batchCodes');
            const actions = document.getElementById('batchActions');
            textarea.classList.toggle('active');
            actions.classList.toggle('active');
        }
        
        function addBatchCodes() {
            const textarea = document.getElementById('batchCodes');
            let codesText = textarea.value;
            
            if (!codesText.trim()) {
                showNotification('❌ Моля, въведете кодове');
                return;
            }
            
            // Разделяне на кодове - по нов ред или запетая
            let codes = [];
            if (codesText.includes('\n')) {
                codes = codesText.split('\n').map(c => c.trim().toUpperCase()).filter(c => c);
            } else {
                codes = codesText.split(',').map(c => c.trim().toUpperCase()).filter(c => c);
            }
            
            if (codes.length === 0) {
                showNotification('❌ Няма валидни кодове');
                return;
            }
            
            let added = 0;
            let notFound = [];
            let outOfStock = [];
            
            codes.forEach(code => {
                const product = allProducts.find(p => p.code && p.code.toUpperCase() === code);
                if (!product) {
                    notFound.push(code);
                } else if (product.stock === 0) {
                    outOfStock.push(`${product.brand} ${product.model}`);
                } else {
                    const existingItem = cart.find(item => item.id === product.id);
                    const maxStock = product.stock > 9 ? 999 : product.stock;
                    const currentQuantity = existingItem ? existingItem.quantity : 0;
                    
                    if (currentQuantity < maxStock) {
                        if (existingItem) {
                            existingItem.quantity = Math.min(currentQuantity + 1, maxStock);
                        } else {
                            cart.push({ ...product, quantity: 1 });
                        }
                        added++;
                        orderFrequency[product.code] = (orderFrequency[product.code] || 0) + 1;
                    }
                }
            });
            
            localStorage.setItem('orderFrequency', JSON.stringify(orderFrequency));
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
            updateFrequentProducts();
            
            let message = `✅ Добавени ${added} продукта`;
            if (notFound.length > 0) message += `\n❌ Не са намерени: ${notFound.join(', ')}`;
            if (outOfStock.length > 0) message += `\n⚠ Няма наличност: ${outOfStock.join(', ')}`;
            
            showNotification(message);
            
            // Изчистване на текстовото поле
            if (added === codes.length) {
                textarea.value = '';
                textarea.classList.remove('active');
                document.getElementById('batchActions').classList.remove('active');
            }
        }
        
        function clearBatchArea() {
            document.getElementById('batchCodes').value = '';
        }
        
        // ==================== ЧЕСТО ПОРЪЧВАНИ ПРОДУКТИ ====================
        function updateFrequentProducts() {
            const frequentContainer = document.getElementById('frequentProducts');
            const frequentList = document.getElementById('frequentList');
            
            // Вземаме топ 5 най-често поръчвани продукта
            const sorted = Object.entries(orderFrequency)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
            
            if (sorted.length === 0) {
                frequentContainer.style.display = 'none';
                return;
            }
            
            frequentContainer.style.display = 'block';
            frequentList.innerHTML = sorted.map(([code, count]) => {
                const product = allProducts.find(p => p.code === code);
                if (!product) return '';
                return `<div class="frequent-tag" onclick="quickAddByCode('${code}')">${product.brand} ${product.model} (${count})</div>`;
            }).join('');
        }
        
        function quickAddByCode(code) {
            document.getElementById('quickCodeInput').value = code;

        // ==================== ОСТАНАЛИТЕ ФУНКЦИИ ОТ ПРЕДИШНАТА ВЕРСИЯ ====================
        // (запазвам ги същите, добавяйки code в renderProducts)
        
        function loadProductsFromGoogleSheets() {
            showLoading(true);
            updateStatus('⏳ Зареждане...');
            
            const url = GOOGLE_SHEETS_URL + '&nocache=' + new Date().getTime();
            
            fetch(url, { 
                mode: 'cors',
                cache: 'no-store'
            })
                .then(response => response.text())
                .then(csvData => {
                    allProducts = parseCSV(csvData);
                    if (allProducts.length === 0) throw new Error('Няма данни');
                    initializeFilters();
                    filterProducts();
                    updateFrequentProducts();
                    updateStatus('✓ Синхронизирано');
                    showLoading(false);
                })
                .catch(error => {
                    console.error('Грешка:', error);
                    updateStatus('⚠ Демо режим');
                    loadSampleData();
                });
        }
        
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            if (lines.length < 2) return [];
            
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const products = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;
                
                const values = parseCSVLine(lines[i]);
                if (values.length !== headers.length) continue;
                
                const product = {};
                for (let j = 0; j < headers.length; j++) {
                    product[headers[j]] = values[j] ? values[j].replace(/"/g, '').trim() : '';
                }
                
                const parsedProduct = {
                    id: i,
                    brand: product['Марка'] || product['Brand'] || 'Няма марка',
                    model: product['Модел'] || product['Model'] || 'Без модел',
                    group: product['Група'] || product['Group'] || 'Общи',
                    stock: parseInt(product['Наличност'] || product['Stock'] || '0'),
                    code: product['Код'] || product['Code'] || product['code'] || `PRD${i}`,
                    description: product['Описание'] || ''
                };
                
                if (isNaN(parsedProduct.stock)) parsedProduct.stock = 0;
                products.push(parsedProduct);
            }
            return products;
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else current += char;
            }
            result.push(current);
            return result;
        }

        function initializeFilters() { updateSmartFilters(); }
        
        function updateSmartFilters() {
            let baseProducts = allProducts;
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                baseProducts = allProducts.filter(p => 
                    p.brand.toLowerCase().includes(term) ||
                    p.model.toLowerCase().includes(term) ||
                    p.group.toLowerCase().includes(term) ||
                    p.code.toLowerCase().includes(term)
                );
            }
            
            const groups = [...new Set(baseProducts.map(p => p.group))].sort();
            const brands = [...new Set(baseProducts.map(p => p.brand))].sort();
            
            const groupSelect = document.getElementById('groupFilter');
            const brandSelect = document.getElementById('brandFilter');
            const currentGroup = groupSelect.value;
            
            groupSelect.innerHTML = '<option value="all">Всички групи</option>' + 
                groups.map(g => `<option value="${g}" ${g === currentGroup ? 'selected' : ''}>${g}</option>`).join('');
            
            let relevantBrands = brands;
            if (currentGroup !== 'all') {
                const productsInGroup = baseProducts.filter(p => p.group === currentGroup);
                relevantBrands = [...new Set(productsInGroup.map(p => p.brand))].sort();
            }
            
            const currentBrand = brandSelect.value;
            brandSelect.innerHTML = '<option value="all">Всички марки</option>' + 
                relevantBrands.map(b => `<option value="${b}" ${b === currentBrand ? 'selected' : ''}>${b}</option>`).join('');
        }
        
        function filterProducts() {
            const group = document.getElementById('groupFilter').value;
            const brand = document.getElementById('brandFilter').value;
            
            let filtered = allProducts;
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(p => 
                    p.brand.toLowerCase().includes(term) ||
                    p.model.toLowerCase().includes(term) ||
                    p.group.toLowerCase().includes(term) ||
                    p.code.toLowerCase().includes(term)
                );
            }
            
            if (group !== 'all') filtered = filtered.filter(p => p.group === group);
            if (brand !== 'all') filtered = filtered.filter(p => p.brand === brand);
            if (hideZeroStock) filtered = filtered.filter(p => p.stock > 0);
            
            filteredProducts = filtered;
            updateSmartFilters();
            renderProducts();
            updateStats();
        }
        
        function handleSearch() {
            searchTerm = document.getElementById('searchInput').value;
            filterProducts();
        }
        
        function toggleHideZero() {
            hideZeroStock = !hideZeroStock;
            const btn = document.getElementById('hideZeroBtn');
            btn.classList.toggle('active');
            btn.innerHTML = hideZeroStock ? '<span>👁️</span> Покажи нулевите' : '<span>👁️</span> Скрий нулевите';
            filterProducts();
        }
        
        function updateStats() {
            document.getElementById('totalProducts').textContent = allProducts.length;
            document.getElementById('shownProducts').textContent = filteredProducts.length;
            document.getElementById('inStockProducts').textContent = allProducts.filter(p => p.stock > 0).length;
        }
        
        function formatStock(stock) { return stock > 9 ? '>9' : stock.toString(); }
        function getStockClass(stock) { return stock === 0 ? 'low' : stock <= 3 ? 'medium' : 'high'; }
        
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if (filteredProducts.length === 0) {
                grid.innerHTML = '<div class="no-products">🔍 Няма намерени продукти</div>';
                return;
            }
            
            grid.innerHTML = filteredProducts.map(product => {
                const inCart = cart.find(item => item.id === product.id);
                const currentQuantity = inCart ? inCart.quantity : 0;
                const maxStock = product.stock > 9 ? 999 : product.stock;
                const isOutOfStock = product.stock === 0;
                const isMaxReached = currentQuantity >= maxStock;
                
                return `
                <div class="product-card ${selectedProducts.has(product.id) ? 'selected' : ''} ${isOutOfStock ? 'out-of-stock' : ''}" 
                     onclick="toggleProductSelection(${product.id})">
                    <div class="product-brand">${product.brand}</div>
                    <div class="product-name">${product.model}</div>
                    <div class="product-code">📄 Код: ${product.code}</div>
                    <div class="product-group">${product.group}</div>
                    <div class="product-stock ${getStockClass(product.stock)}">📦 ${formatStock(product.stock)}</div>
                    <div class="product-footer">
                        <button class="add-btn" onclick="addToCart(${product.id}); event.stopPropagation();"
                                ${isOutOfStock || isMaxReached ? 'disabled' : ''}>${isOutOfStock ? '×' : '+'}</button>
                    </div>
                </div>`;
            }).join('');
            updateSelectedCount();
        }
        
        function toggleProductSelection(id) {
            selectedProducts.has(id) ? selectedProducts.delete(id) : selectedProducts.add(id);
            renderProducts();
        }
        
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = `${selectedProducts.size} избрани`;
        }
        
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product || product.stock === 0) return;
            
            const existingItem = cart.find(item => item.id === productId);
            const maxStock = product.stock > 9 ? 999 : product.stock;
            
            if (existingItem && existingItem.quantity >= maxStock) {
                showNotification(`⚠ Максимална наличност ${formatStock(product.stock)}`);
                return;
            }
            
            if (existingItem) existingItem.quantity++;
            else cart.push({ ...product, quantity: 1 });
            
            orderFrequency[product.code] = (orderFrequency[product.code] || 0) + 1;
            localStorage.setItem('orderFrequency', JSON.stringify(orderFrequency));
            
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
            updateFrequentProducts();
            showNotification(`✅ Добавен: ${product.brand} ${product.model}`);
        }
        
        function updateQuantity(id, newQty) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            const product = allProducts.find(p => p.id === id);
            const maxStock = product.stock > 9 ? 999 : product.stock;
            
            if (newQty < 1) removeFromCart(id);
            else if (newQty > maxStock) {
                showNotification(`⚠ Максимум ${formatStock(product.stock)}`);
                item.quantity = maxStock;
            } else item.quantity = newQty;
            
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
        }
        
        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
        }
        
        function updateCartDisplay() {
            const cartItemsDiv = document.getElementById('cartItems');
            if (cart.length === 0) cartItemsDiv.innerHTML = '<div style="text-align: center; padding: 20px;">Количката е празна</div>';
            else {
                cartItemsDiv.innerHTML = cart.map(item => {
                    const product = allProducts.find(p => p.id === item.id);
                    const maxStock = product?.stock > 9 ? 999 : (product?.stock || 999);
                    return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.brand} - ${item.model}</h4>
                            <p>Код: ${item.code} | Група: ${item.group}</p>
                        </div>
                        <div class="cart-item-actions">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                            <input type="number" class="quantity-input" value="${item.quantity}" min="1" max="${maxStock}"
                                   onchange="updateQuantity(${item.id}, parseInt(this.value))">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})">×</button>
                        </div>
                    </div>`;
                }).join('');
            }
            
            const total = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cartPanelCount').textContent = `${total} бр.`;
            document.getElementById('cartTotal').textContent = `Общо: ${total} бр.`;
            document.getElementById('cartCount').textContent = total;
        }

            if (confirm('Изчистване на количката?')) {
                cart = [];
                updateCartDisplay();
                saveCartToLocalStorage();
                renderProducts();
            }
        }
        
        function saveCartToLocalStorage() { localStorage.setItem('cart', JSON.stringify(cart)); }
        function loadCartFromLocalStorage() {
            const saved = localStorage.getItem('cart');

            <div class="cart-footer"><div id="modalCartTotal"></div></div>
        </div>
    </div>
    <div class="modal" id="historyModal"><div class="modal-content"><h2>История</h2><div id="historyList"></div></div></div>
    
    <style>
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-5px)}
            75%{transform:translateX(5px)}
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360)} }
        .loading { text-align: center; padding: 50px; display: none; }
        .loading.active { display: block; }
        .stats-bar { background: #f0f4ff; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 20px; }
        .stats-item { display: flex; gap: 8px; }
    </style>
</body>
