<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АВТОЗОНА 33 - Професионална система</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .login-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .login-btn:hover {
            background: white;
            color: #667eea;
        }
        
        .main-content {
            padding: 30px;
        }
        
        /* Quick Add Section */
        .quick-add-section {
            background: linear-gradient(135deg, #f5f7ff 0%, #eef2ff 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #667eea20;
        }
        
        .quick-add-title {
            font-size: 14px;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quick-add-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .code-input-group {
            flex: 2;
            min-width: 250px;
            position: relative;
        }
        
        .code-input-group input {
            width: 100%;
            padding: 14px 20px;
            padding-left: 45px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }
        
        .code-input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .code-input-group::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #999;
        }
        
        .code-input-group .barcode-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #999;
            pointer-events: none;
        }
        
        .quantity-add-group {
            flex: 1;
            min-width: 120px;
        }
        
        .quantity-add-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
        }
        
        .quick-add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .quick-add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .batch-add-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #ddd;
        }
        
        .batch-add-toggle {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .batch-textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
            display: none;
        }
        
        .batch-textarea.active {
            display: block;
        }
        
        .batch-actions {
            margin-top: 10px;
            display: none;
            gap: 10px;
        }
        
        .batch-actions.active {
            display: flex;
        }
        
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tool-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .tool-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .tool-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .tool-btn.secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .tool-btn.secondary:hover {
            background: #e0e0e0;
        }
        
        .status-badge {
            background: #4CAF50;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .search-box {
            flex: 2;
            min-width: 250px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            padding-left: 45px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: #999;
        }
        
        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .filter-group label {
            font-weight: bold;
            color: #555;
            min-width: 60px;
        }
        
        .filter-select {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            min-width: 180px;
            background: white;
            cursor: pointer;
        }
        
        .hide-zero-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .hide-zero-btn.active {
            background: #667eea;
            color: white;
        }
        
        .selected-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-left: auto;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .product-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        
        .product-card.selected {
            border: 2px solid #667eea;
            background: #f0f4ff;
        }
        
        .product-card.out-of-stock {
            opacity: 0.6;
            background: #f5f5f5;
        }
        
        .product-brand {
            color: #667eea;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            padding-right: 50px;
        }
        
        .product-code {
            font-size: 12px;
            color: #999;
            font-family: monospace;
            margin-bottom: 5px;
        }
        
        .product-group {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .product-stock {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .product-stock.low {
            background: #ffebee;
            color: #c62828;
        }
        
        .product-stock.medium {
            background: #fff3e0;
            color: #ef6c00;
        }
        
        .product-stock.high {
            background: #e8f5e8;
            color: #2e7d32;
        }
        
        .product-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }
        
        .add-btn {
            background: #4CAF50;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .add-btn:hover {
            background: #45a049;
            transform: scale(1.1);
        }
        
        .add-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .no-products {
            grid-column: 1/-1;
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 16px;
        }
        
        .cart-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .cart-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        .cart-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 16px;
        }
        
        .cart-items {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .cart-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .cart-item-info {
            flex: 1;
            min-width: 200px;
        }
        
        .cart-item-info h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .cart-item-info p {
            color: #666;
            font-size: 14px;
        }
        
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .quantity-input {
            width: 70px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
        
        .quantity-btn {
            background: #f0f0f0;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .quantity-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .remove-btn {
            background: #ff4444;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        .remove-btn:hover {
            background: #cc0000;
        }
        
        .cart-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid #ddd;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .cart-total {
            font-size: 18px;
            font-weight: bold;
        }
        
        .cart-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }
        
        .shortcuts-hint {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .shortcuts-hint kbd {
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
        }
        
        .frequent-products {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 12px;
        }
        
        .frequent-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .frequent-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .frequent-tag {
            background: white;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .frequent-tag:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .stats-bar {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .stats-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .stats-label {
            color: #666;
        }
        
        .stats-value {
            font-weight: bold;
            color: #667eea;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-5px)}
            75%{transform:translateX(5px)}
        }
        
        @media (max-width: 768px) {
            .toolbar, .filters, .quick-add-row {
                flex-direction: column;
            }
            .products-grid {
                grid-template-columns: 1fr;
            }
            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }
        }

        /* ==================== NEW: THEME TOGGLE & ICON BUTTONS ==================== */
        .icon-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            background: white;
            color: #667eea;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* ==================== NEW: LIST VIEW ==================== */
        .products-grid.list-view {
            grid-template-columns: 1fr;
            gap: 8px;
        }
        .products-grid.list-view .product-card {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) 2fr auto auto auto;
            gap: 16px;
            align-items: center;
            padding: 12px 20px;
        }
        .products-grid.list-view .product-brand {
            margin-bottom: 0;
        }
        .products-grid.list-view .product-name {
            font-size: 15px;
            margin-bottom: 0;
            padding-right: 0;
        }
        .products-grid.list-view .product-code {
            margin-bottom: 0;
            white-space: nowrap;
        }
        .products-grid.list-view .product-group {
            display: none;
        }
        .products-grid.list-view .product-stock {
            position: static;
        }
        .products-grid.list-view .product-footer {
            margin-top: 0;
        }
        .products-grid.list-view .product-card:hover {
            transform: none;
        }
        .view-toggle-btn {
            padding: 10px 16px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .view-toggle-btn:hover {
            background: #667eea;
            color: white;
        }
        .clear-filters-btn {
            padding: 10px 16px;
            border: 2px solid #ff4444;
            border-radius: 10px;
            background: white;
            color: #ff4444;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .clear-filters-btn:hover {
            background: #ff4444;
            color: white;
        }

        /* ==================== NEW: AUTOCOMPLETE ==================== */
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 4px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            max-height: 280px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }
        .autocomplete-dropdown.active {
            display: block;
        }
        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover,
        .autocomplete-item.highlighted {
            background: #f0f4ff;
        }
        .autocomplete-code {
            font-family: monospace;
            color: #667eea;
            font-weight: bold;
            white-space: nowrap;
        }
        .autocomplete-name {
            flex: 1;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .autocomplete-stock {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #e8f5e8;
            color: #2e7d32;
        }
        .autocomplete-stock.zero {
            background: #ffebee;
            color: #c62828;
        }

        /* ==================== NEW: HISTORY SEARCH/FILTERS ==================== */
        .history-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .history-controls input,
        .history-controls select {
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }
        .history-search-input {
            flex: 1;
            min-width: 200px;
        }
        .history-item {
            position: relative;
        }
        .history-item-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .history-action-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .history-action-btn.duplicate {
            background: #667eea;
            color: white;
        }
        .history-action-btn.duplicate:hover {
            background: #5568d3;
        }
        .history-action-btn.delete {
            background: #f0f0f0;

    <script>
        // ==================== КОНФИГУРАЦИЯ ====================
        const GOOGLE_SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT-vUn0NhIFZHcJ0lLPcG8EdzIbdRPxQ5UPUSufkdvih5TiIrk7GHsdOZhF3Ne2l1n4zmBYa7nSf6c/pub?output=csv';
        
        // ==================== ГЛОБАЛНИ ПРОМЕНЛИВИ ====================
        let allProducts = [];
        let filteredProducts = [];
        let cart = [];
        let selectedProducts = new Set();
        let orders = JSON.parse(localStorage.getItem('orders') || '[]');
        let hideZeroStock = false;
        let searchTerm = '';
        let orderFrequency = JSON.parse(localStorage.getItem('orderFrequency') || '{}');
        // НОВИ:
        let viewMode = localStorage.getItem('viewMode') || 'grid';  // 'grid' или 'list'
        let lastClearedCart = null;
        let undoTimer = null;
        let autocompleteIndex = -1;
        let renderedCount = 0;  // за lazy rendering
        const RENDER_BATCH = 60;
        
        // ==================== ДОБАВЯНЕ ПО КОД ====================
        function addProductByCode() {
            const codeInput = document.getElementById('quickCodeInput');
            const code = codeInput.value.trim();
            const quantity = parseInt(document.getElementById('quickQuantity').value) || 1;
            
            if (!code) {
                showNotification('❌ Моля, въведете код на продукт');
                return;
            }
            
            const product = allProducts.find(p => p.code && p.code.toString() === code);
            
            if (!product) {
                showNotification(`❌ Не е намерен продукт с код: ${code}`);
                codeInput.style.animation = 'shake 0.3s ease';
                setTimeout(() => { codeInput.style.animation = ''; }, 300);
                return;
            }
            
            if (product.stock === 0) {
                showNotification(`❌ ${product.brand} ${product.model} - Няма наличност`);
                return;
            }
            
            const existingItem = cart.find(item => item.id === product.id);
            const maxStock = product.stock > 9 ? 999 : product.stock;
            const currentQuantity = existingItem ? existingItem.quantity : 0;
            const newQuantity = currentQuantity + quantity;
            
            if (newQuantity > maxStock) {
                showNotification(`⚠ Достигнахте максималната наличност (${formatStock(product.stock)})`);
                return;
            }
            
            if (existingItem) {
                existingItem.quantity = newQuantity;
            } else {
                cart.push({ ...product, quantity: quantity });
            }
            
            orderFrequency[product.code] = (orderFrequency[product.code] || 0) + 1;
            localStorage.setItem('orderFrequency', JSON.stringify(orderFrequency));
            
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
            updateFrequentProducts();
            
            codeInput.value = '';
            codeInput.focus();
            showNotification(`✅ Добавен: ${product.brand} ${product.model} x${quantity}`);
        }
        
        function toggleBatchAdd() {
            const textarea = document.getElementById('batchCodes');
            const actions = document.getElementById('batchActions');
            textarea.classList.toggle('active');
            actions.classList.toggle('active');
        }
        
        function addBatchCodes() {
            const textarea = document.getElementById('batchCodes');
            let codesText = textarea.value;
            
            if (!codesText.trim()) {
                showNotification('❌ Моля, въведете кодове');
                return;
            }
            
            let codes = [];
            if (codesText.includes('\n')) {
                codes = codesText.split('\n').map(c => c.trim()).filter(c => c);
            } else {
                codes = codesText.split(',').map(c => c.trim()).filter(c => c);
            }
            
            let added = 0;
            let notFound = [];
            let outOfStock = [];
            
            codes.forEach(code => {
                const product = allProducts.find(p => p.code && p.code.toString() === code);
                if (!product) {
                    notFound.push(code);
                } else if (product.stock === 0) {
                    outOfStock.push(`${product.brand} ${product.model}`);
                } else {
                    const existingItem = cart.find(item => item.id === product.id);
                    const maxStock = product.stock > 9 ? 999 : product.stock;
                    const currentQuantity = existingItem ? existingItem.quantity : 0;
                    
                    if (currentQuantity < maxStock) {
                        if (existingItem) {
                            existingItem.quantity = Math.min(currentQuantity + 1, maxStock);
                        } else {
                            cart.push({ ...product, quantity: 1 });
                        }
                        added++;
                        orderFrequency[product.code] = (orderFrequency[product.code] || 0) + 1;
                    }
                }
            });
            
            localStorage.setItem('orderFrequency', JSON.stringify(orderFrequency));
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
            updateFrequentProducts();
            
            let message = `✅ Добавени ${added} продукта`;
            if (notFound.length > 0) message += `\n❌ Не са намерени: ${notFound.join(', ')}`;
            if (outOfStock.length > 0) message += `\n⚠ Няма наличност: ${outOfStock.join(', ')}`;
            showNotification(message);
            
            if (added === codes.length) {
                textarea.value = '';
                textarea.classList.remove('active');
                document.getElementById('batchActions').classList.remove('active');
            }
        }
        
        function clearBatchArea() {
            document.getElementById('batchCodes').value = '';
        }
        
        function updateFrequentProducts() {
            const frequentContainer = document.getElementById('frequentProducts');
            const frequentList = document.getElementById('frequentList');
            
            const sorted = Object.entries(orderFrequency)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);
            
            if (sorted.length === 0 || allProducts.length === 0) {
                frequentContainer.style.display = 'none';
                return;
            }
            
            frequentContainer.style.display = 'block';
            frequentList.innerHTML = sorted.map(([code, count]) => {
                const product = allProducts.find(p => p.code && p.code.toString() === code);
                if (!product) return '';
                const shortName = product.model.length > 30 ? product.model.substring(0, 27) + '...' : product.model;
                return `<div class="frequent-tag" onclick="quickAddByCode('${code}')">${product.brand}: ${shortName} (${count})</div>`;
            }).join('');
        }
        
        function quickAddByCode(code) {
            document.getElementById('quickCodeInput').value = code;
            addProductByCode();
        }
        
        // ==================== ЗАРЕЖДАНЕ НА ДАННИ ====================
        function loadProductsFromGoogleSheets() {
            showLoading(true);
            updateStatus('⏳ Зареждане...');
            
            const url = GOOGLE_SHEETS_URL + '&nocache=' + new Date().getTime();
            
            fetch(url, { mode: 'cors', cache: 'no-store' })
                .then(response => response.text())
                .then(csvData => {
                    allProducts = parseCSV(csvData);
                    if (allProducts.length === 0) throw new Error('Няма данни');
                    initializeFilters();
                    filterProducts();
                    updateFrequentProducts();
                    updateStatus('✓ Синхронизирано');
                    showLoading(false);
                })
                .catch(error => {
                    console.error('Грешка:', error);
                    updateStatus('⚠ Демо режим');
                    loadSampleData();
                });
        }
        
        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            if (lines.length < 2) return [];
            
            const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const products = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;
                
                const values = parseCSVLine(lines[i]);
                if (values.length !== headers.length) continue;
                
                const product = {};
                for (let j = 0; j < headers.length; j++) {
                    product[headers[j]] = values[j] ? values[j].replace(/"/g, '').trim() : '';
                }
                
                const parsedProduct = {
                    id: i,
                    brand: product['Марка'] || product['Brand'] || product['brand'] || 'Няма марка',
                    model: product['Модел'] || product['Model'] || product['model'] || 'Без модел',
                    group: product['Група'] || product['Group'] || product['group'] || 'Общи',
                    stock: parseInt(product['Наличност'] || product['Stock'] || product['stock'] || product['Количество'] || '0'),
                    code: product['Код'] || product['Code'] || product['code'] || `PRD${i}`,
                    description: product['Описание'] || product['Description'] || ''
                };
                
                if (isNaN(parsedProduct.stock)) parsedProduct.stock = 0;
                products.push(parsedProduct);
            }
            return products;
        }
        
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else current += char;
            }
            result.push(current);
            return result;
        }
        
        function loadSampleData() {
            allProducts = [
                { id: 1, brand: 'Grom', model: '100Ah 780A D31 JL+ Grom EFB', group: 'Автомобили', stock: 12, code: '1', description: '' },
                { id: 2, brand: 'Grom', model: '100Ah 780A D31 JR+ Grom EFB', group: 'Автомобили', stock: 50, code: '2', description: '' },
                { id: 3, brand: 'Grom', model: '100Ah 800A D31 Neutral JL+', group: 'Автомобили', stock: 1, code: '3', description: '' },
                { id: 4, brand: 'Grom', model: '100Ah 850A D31 JL+ Grom', group: 'Автомобили', stock: 19, code: '4', description: '' },
                { id: 5, brand: 'Grom', model: '100Ah 850A D31 JR+ Grom', group: 'Автомобили', stock: 117, code: '5', description: '' },
                { id: 6, brand: 'Grom', model: '110Ah 900A L5 Grom', group: 'Автомобили', stock: 96, code: '6', description: '' },
                { id: 7, brand: 'Grom', model: '110Ah 900A L6 Grom', group: 'Автомобили', stock: 10, code: '7', description: '' },
                { id: 8, brand: 'EAS', model: '12V105AH - 960A EAS Activa L5', group: 'Автомобили', stock: 0, code: '8', description: '' }
            ];
            initializeFilters();
            filterProducts();
            updateFrequentProducts();
            updateStats();
            updateStatus('⚠ Демо данни (няма връзка)');
            showLoading(false);
        }
        
        // ==================== ФУНКЦИИ ЗА ФИЛТРИРАНЕ (ИНТЕЛИГЕНТНИ) ====================
        function filterProducts() {
            const group = document.getElementById('groupFilter').value;
            const brand = document.getElementById('brandFilter').value;
            
            let filtered = allProducts;
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(p => 
                    p.brand.toLowerCase().includes(term) ||
                    p.model.toLowerCase().includes(term) ||
                    p.group.toLowerCase().includes(term) ||
                    p.code.toLowerCase().includes(term)
                );
            }
            
            if (group !== 'all') {
                filtered = filtered.filter(p => p.group === group);
            }
            
            if (brand !== 'all') {
                filtered = filtered.filter(p => p.brand === brand);
            }
            
            if (hideZeroStock) {
                filtered = filtered.filter(p => p.stock > 0);
            }
            
            filteredProducts = filtered;
            updateSmartFilters();
            renderProducts();
            updateStats();
        }
        
        function updateSmartFilters() {
            const groupFilter = document.getElementById('groupFilter');
            const brandFilter = document.getElementById('brandFilter');
            
            const currentGroup = groupFilter.value;
            const currentBrand = brandFilter.value;
            
            let searchBase = allProducts;
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                searchBase = searchBase.filter(p => 
                    p.brand.toLowerCase().includes(term) ||
                    p.model.toLowerCase().includes(term) ||
                    p.group.toLowerCase().includes(term) ||
                    p.code.toLowerCase().includes(term)
                );
            }
            
            const groups = [...new Set(searchBase.map(p => p.group))].sort();
            groupFilter.innerHTML = '<option value="all">📁 Всички групи</option>' + 
                groups.map(g => `<option value="${g}" ${g === currentGroup ? 'selected' : ''}>${g}</option>`).join('');
            
            let brandBase = searchBase;
            if (currentGroup !== 'all') {
                brandBase = brandBase.filter(p => p.group === currentGroup);
            }
            
            const brands = [...new Set(brandBase.map(p => p.brand))].sort();
            
            let newBrand = currentBrand;
            if (currentBrand !== 'all' && !brands.includes(currentBrand)) {
                newBrand = 'all';
            }
            
            brandFilter.innerHTML = '<option value="all">🏷️ Всички марки</option>' + 
                brands.map(b => `<option value="${b}" ${b === newBrand ? 'selected' : ''}>${b}</option>`).join('');
            
            if (newBrand !== currentBrand) {
                const finalGroup = groupFilter.value;
                const finalBrand = brandFilter.value;
                
                let tempFiltered = allProducts;
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    tempFiltered = tempFiltered.filter(p => 
                        p.brand.toLowerCase().includes(term) ||
                        p.model.toLowerCase().includes(term) ||
                        p.group.toLowerCase().includes(term) ||
                        p.code.toLowerCase().includes(term)
                    );
                }
                if (finalGroup !== 'all') tempFiltered = tempFiltered.filter(p => p.group === finalGroup);
                if (finalBrand !== 'all') tempFiltered = tempFiltered.filter(p => p.brand === finalBrand);
                if (hideZeroStock) tempFiltered = tempFiltered.filter(p => p.stock > 0);
                
                filteredProducts = tempFiltered;
                renderProducts();
                updateStats();
            }
        }
        
        function initializeFilters() {
            updateSmartFilters();
        }
        
        function handleSearch() {
            searchTerm = document.getElementById('searchInput').value;
            filterProducts();
        }
        
        function toggleHideZero() {
            hideZeroStock = !hideZeroStock;
            const btn = document.getElementById('hideZeroBtn');
            btn.classList.toggle('active');
            btn.innerHTML = hideZeroStock ? '<span>👁️</span> Покажи нулевите' : '<span>👁️</span> Скрий нулевите';
            filterProducts();
        }
        
        function updateStats() {
            document.getElementById('totalProducts').textContent = allProducts.length;
            document.getElementById('shownProducts').textContent = filteredProducts.length;
            const inStock = allProducts.filter(p => p.stock > 0).length;
            document.getElementById('inStockProducts').textContent = inStock;
        }
        
        function formatStock(stock) {
            if (stock > 9) return '>9';
            if (stock === 0) return '0';
            return stock.toString();
        }
        
        function getStockClass(stock) {
            if (stock === 0) return 'low';
            if (stock <= 3) return 'medium';
            return 'high';
        }
        
        // ==================== РЕНДЕРИРАНЕ ====================
        function buildProductCardHtml(product) {
            const inCart = cart.find(item => item.id === product.id);
            const currentQuantity = inCart ? inCart.quantity : 0;
            const maxStock = product.stock > 9 ? 999 : product.stock;
            const isOutOfStock = product.stock === 0;
            const isMaxReached = currentQuantity >= maxStock;
            const isSelected = selectedProducts.has(product.id);

            return `
                <div class="product-card ${isSelected ? 'selected' : ''} ${isOutOfStock ? 'out-of-stock' : ''}" 
                     onclick="toggleProductSelection(${product.id})">
                    <div class="product-brand">${escapeHtml(product.brand)}</div>
                    <div class="product-name">${escapeHtml(product.model)}</div>
                    <div class="product-code">📄 Код: ${escapeHtml(product.code)}</div>
                    <div class="product-group">${escapeHtml(product.group)}</div>
                    <div class="product-stock ${getStockClass(product.stock)}">
                        📦 ${formatStock(product.stock)}
                    </div>
                    <div class="product-footer">
                        <button class="add-btn" 
                                onclick="addToCart(${product.id}); event.stopPropagation();"
                                ${isOutOfStock || isMaxReached ? 'disabled' : ''}>
                            ${isOutOfStock ? '×' : '+'}
                        </button>
                    </div>
                </div>
            `;
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');

            if (filteredProducts.length === 0) {
                grid.innerHTML = '<div class="no-products">🔍 Няма намерени продукти</div>';
                renderedCount = 0;
                updateSelectedCount();
                return;
            }

            // Lazy rendering: рендирай първите RENDER_BATCH, останалите при скрол
            const initial = filteredProducts.slice(0, RENDER_BATCH);
            grid.innerHTML = initial.map(buildProductCardHtml).join('');
            renderedCount = initial.length;

            updateSelectedCount();
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function toggleProductSelection(productId) {
            if (selectedProducts.has(productId)) {
                selectedProducts.delete(productId);
            } else {
                selectedProducts.add(productId);
            }
            renderProducts();
        }
        
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = `${selectedProducts.size} избрани`;
        }
        
        // ==================== КОЛИЧКА ====================
        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;
            
            if (product.stock === 0) {
                showNotification('❌ Продуктът не е наличен');
                return;
            }
            
            const existingItem = cart.find(item => item.id === productId);
            const maxStock = product.stock > 9 ? 999 : product.stock;
            
            if (existingItem && existingItem.quantity >= maxStock) {
                showNotification(`⚠ Достигнахте максималната наличност (${formatStock(product.stock)})`);
                return;
            }
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            orderFrequency[product.code] = (orderFrequency[product.code] || 0) + 1;
            localStorage.setItem('orderFrequency', JSON.stringify(orderFrequency));
            
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
            updateFrequentProducts();
            showNotification(`✅ Добавен: ${product.brand} ${product.model}`);
        }
        
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
        }
        
        function updateQuantity(productId, newQuantity) {
            const item = cart.find(item => item.id === productId);
            if (!item) return;
            
            const product = allProducts.find(p => p.id === productId);
            const maxStock = product.stock > 9 ? 999 : product.stock;
            
            if (newQuantity < 1) {
                removeFromCart(productId);
                return;
            }
            
            if (newQuantity > maxStock) {
                showNotification(`⚠ Максималната наличност е ${formatStock(product.stock)}`);
                item.quantity = maxStock;
            } else {
                item.quantity = newQuantity;
            }
            
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
        }
        
        function handleQuantityInput(productId, value) {
            const quantity = parseInt(value);
            if (!isNaN(quantity)) {
                updateQuantity(productId, quantity);
            }
        }
        
        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            const cartPanelCount = document.getElementById('cartPanelCount');
            const cartTotal = document.getElementById('cartTotal');
            const cartCount = document.getElementById('cartCount');
            
            if (cart.length === 0) {
                cartItems.innerHTML = '<div style="text-align: center; padding: 20px; color: #666;">Количката е празна</div>';
            } else {
                cartItems.innerHTML = cart.map(item => {
                    const product = allProducts.find(p => p.id === item.id);
                    const maxStock = product ? (product.stock > 9 ? 999 : product.stock) : 999;
                    const isMaxReached = item.quantity >= maxStock;
                    
                    return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${escapeHtml(item.brand)} - ${escapeHtml(item.model)}</h4>
                            <p>Код: ${escapeHtml(item.code)} | Група: ${escapeHtml(item.group)}</p>
                            ${isMaxReached ? '<div class="stock-warning" style="color:#ef6c00;font-size:12px;">⚠ Максимална наличност</div>' : ''}
                        </div>
                        <div class="cart-item-actions">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                            <input type="number" class="quantity-input" 
                                   value="${item.quantity}" 
                                   min="1" 
                                   max="${maxStock}"
                                   onchange="handleQuantityInput(${item.id}, this.value)">
                            <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})"
                                    ${isMaxReached ? 'disabled' : ''}>+</button>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})">×</button>
                        </div>
                    </div>
                `}).join('');
            }
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartPanelCount.textContent = `${totalItems} бр.`;
            cartTotal.textContent = `Общо: ${totalItems} бр.`;
            cartCount.textContent = totalItems;
            
            const modal = document.getElementById('cartModal');
            if (modal && modal.classList.contains('active')) {
                showCartModal();
            }
        }
        
        function clearCart() {
            if (cart.length === 0) {
                showNotification('Количката вече е празна');
                return;
            }
            // Запазваме за undo
            lastClearedCart = JSON.parse(JSON.stringify(cart));
            cart = [];
            updateCartDisplay();
            saveCartToLocalStorage();
            renderProducts();
            showUndoToast();
        }

        function showUndoToast() {
            // Премахни стар toast ако има
            const existing = document.getElementById('undoToast');
            if (existing) existing.remove();
            if (undoTimer) clearTimeout(undoTimer);

            const toast = document.createElement('div');
            toast.id = 'undoToast';
            toast.className = 'undo-toast';
            toast.innerHTML = `
                <span>🗑️ Количката е изчистена</span>
                <button onclick="undoClearCart()">↶ Възстанови</button>
            `;
            document.body.appendChild(toast);

            undoTimer = setTimeout(() => {
                if (document.getElementById('undoToast')) {
                    document.getElementById('undoToast').remove();
                }
                lastClearedCart = null;
            }, 10000);
        }

        function undoClearCart() {
            if (lastClearedCart) {
                cart = lastClearedCart;
                lastClearedCart = null;
                updateCartDisplay();
                saveCartToLocalStorage();
                renderProducts();
                showNotification('↶ Количката е възстановена');
            }
            const toast = document.getElementById('undoToast');
            if (toast) toast.remove();
            if (undoTimer) clearTimeout(undoTimer);
        }
        
        function saveCartToLocalStorage() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }
        
        function loadCartFromLocalStorage() {
            const savedCart = localStorage.getItem('cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
                updateCartDisplay();
            }
        }
        
        function saveOrder() {
            if (cart.length === 0) {
                showNotification('Количката е празна!');
                return;
            }
            
            const order = {
                id: Date.now(),
                date: new Date().toLocaleString('bg-BG'),
                items: [...cart],
                total: cart.reduce((sum, item) => sum + item.quantity, 0)
            };
            
            orders.push(order);
            localStorage.setItem('orders', JSON.stringify(orders));
            showNotification('✅ Заявката е запазена в историята');
        }
        
        // ==================== МОДАЛНИ ПРОЗОРЦИ ====================
        function showCartModal() {
            const modal = document.getElementById('cartModal');
            const modalCartItems = document.getElementById('modalCartItems');
            const modalCartTotal = document.getElementById('modalCartTotal');
            
            if (cart.length === 0) {
                modalCartItems.innerHTML = '<div style="text-align: center; padding: 20px;">Количката е празна</div>';
            } else {
                modalCartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${escapeHtml(item.brand)} - ${escapeHtml(item.model)}</h4>
                            <p>Код: ${escapeHtml(item.code)} | Група: ${escapeHtml(item.group)}</p>
                        </div>
                        <div style="font-weight: bold;">Количество: ${item.quantity}</div>
                    </div>
                `).join('');
            }
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            modalCartTotal.textContent = `Общо: ${totalItems} бр.`;
            modal.classList.add('active');
        }
        
        function closeCartModal() {
            document.getElementById('cartModal').classList.remove('active');
        }
        
        function showHistoryModal() {
            document.getElementById('historyModal').classList.add('active');
            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const searchEl = document.getElementById('historySearch');
            const dateEl = document.getElementById('historyDateFilter');
            const sortEl = document.getElementById('historySortOrder');
            const query = (searchEl ? searchEl.value : '').toLowerCase().trim();
            const dateFilter = dateEl ? dateEl.value : 'all';
            const sortOrder = sortEl ? sortEl.value : 'newest';

            let filtered = orders.slice();

            // Дата филтър
            if (dateFilter !== 'all') {
                const now = Date.now();
                const cutoffs = {
                    today: 24 * 3600 * 1000,
                    week: 7 * 24 * 3600 * 1000,
                    month: 30 * 24 * 3600 * 1000
                };
                const cutoff = cutoffs[dateFilter];
                filtered = filtered.filter(o => (now - o.id) <= cutoff);
            }

            // Търсене
            if (query) {
                filtered = filtered.filter(o =>
                    o.items.some(item =>
                        (item.brand || '').toLowerCase().includes(query) ||
                        (item.model || '').toLowerCase().includes(query) ||
                        (item.code || '').toLowerCase().includes(query)
                    )
                );
            }

            // Сортиране
            if (sortOrder === 'newest') filtered.sort((a, b) => b.id - a.id);
            else if (sortOrder === 'oldest') filtered.sort((a, b) => a.id - b.id);
            else if (sortOrder === 'largest') filtered.sort((a, b) => b.total - a.total);

            if (filtered.length === 0) {
                historyList.innerHTML = '<div style="text-align: center; padding: 20px; color:#888;">' +
                    (orders.length === 0 ? 'Няма запазени заявки' : 'Няма заявки, които да отговарят на филтъра') + '</div>';
                return;
            }

            historyList.innerHTML = filtered.map(order => `
                <div class="history-item" style="background:#f8f9fa;padding:15px;border-radius:10px;margin-bottom:10px;">
                    <div style="color:#667eea;font-weight:bold;">📅 ${order.date}</div>
                    <div style="display:flex;justify-content:space-between;color:#666;margin-top:4px;">
                        <span>${order.items.length} артикула</span>
                        <span>${order.total} броя общо</span>
                    </div>
                    <div style="font-size:12px;color:#888;margin-top:6px;">
                        ${order.items.slice(0, 3).map(i => escapeHtml(i.brand + ' ' + i.model)).join(' • ')}
                        ${order.items.length > 3 ? ' • ...' : ''}
                    </div>
                    <div class="history-item-actions">
                        <button class="history-action-btn duplicate" onclick="loadOrder(${order.id})">
                            📋 Дублирай в количка
                        </button>
                        <button class="history-action-btn delete" onclick="deleteOrder(${order.id})">
                            🗑️ Изтрий
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function deleteOrder(orderId) {
            if (!confirm('Да изтрия ли тази заявка от историята?')) return;
            orders = orders.filter(o => o.id !== orderId);
            localStorage.setItem('orders', JSON.stringify(orders));
            renderHistory();
            showNotification('🗑️ Заявката е изтрита');
        }
        
        function closeHistoryModal() {
            document.getElementById('historyModal').classList.remove('active');
        }
        
        function loadOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                cart = order.items.map(item => ({...item}));
                updateCartDisplay();
                saveCartToLocalStorage();
                renderProducts();
                closeHistoryModal();
                showNotification('✅ Заявката е заредена');
            }
        }

        function clearAllFilters() {

            document.getElementById('brandFilter').value = 'all';

            searchTerm = '';
            if (hideZeroStock) {
                hideZeroStock = false;
                const btn = document.getElementById('hideZeroBtn');
                btn.classList.remove('active');
                btn.innerHTML = '<span>👁️</span> Скрий нулевите';
            }
            selectedProducts.clear();
            filterProducts();
            showNotification('✖ Филтрите са изчистени');
        }

        // ---------- Autocomplete за код ----------
        function handleCodeAutocomplete() {
            const input = document.getElementById('quickCodeInput');
            const dropdown = document.getElementById('autocompleteDropdown');
            const query = input.value.trim().toLowerCase();
            autocompleteIndex = -1;

            if (!query || query.length < 1 || allProducts.length === 0) {
                dropdown.classList.remove('active');
                dropdown.innerHTML = '';
                return;
            }

            // Намери до 8 продукта, чийто код или модел съдържа заявката
            const matches = allProducts.filter(p => {
                const code = (p.code || '').toString().toLowerCase();
                const model = (p.model || '').toLowerCase();
                const brand = (p.brand || '').toLowerCase();
                return code.includes(query) || model.includes(query) || brand.includes(query);
            }).slice(0, 8);

            if (matches.length === 0) {
                dropdown.classList.remove('active');
                dropdown.innerHTML = '';
                return;
            }

            dropdown.innerHTML = matches.map((p, i) => `
                <div class="autocomplete-item" data-index="${i}" data-code="${escapeHtml(p.code)}"
                     onclick="selectAutocomplete('${escapeHtml(p.code).replace(/'/g, "\\'")}'); event.stopPropagation();">
                    <span class="autocomplete-code">${escapeHtml(p.code)}</span>
                    <span class="autocomplete-name">${escapeHtml(p.brand)} — ${escapeHtml(p.model)}</span>
                    <span class="autocomplete-stock ${p.stock === 0 ? 'zero' : ''}">${formatStock(p.stock)}</span>
                </div>
            `).join('');
            dropdown.classList.add('active');
        }

        function selectAutocomplete(code) {
            const input = document.getElementById('quickCodeInput');
            input.value = code;
            document.getElementById('autocompleteDropdown').classList.remove('active');
            addProductByCode();
        }

        function navigateAutocomplete(direction) {
            const items = document.querySelectorAll('.autocomplete-item');
            if (items.length === 0) return;
            items.forEach(it => it.classList.remove('highlighted'));
            autocompleteIndex += direction;
            if (autocompleteIndex < 0) autocompleteIndex = items.length - 1;
            if (autocompleteIndex >= items.length) autocompleteIndex = 0;
            items[autocompleteIndex].classList.add('highlighted');
            items[autocompleteIndex].scrollIntoView({ block: 'nearest' });
        }

        function confirmAutocomplete() {
            const items = document.querySelectorAll('.autocomplete-item');
            if (autocompleteIndex >= 0 && items[autocompleteIndex]) {
                const code = items[autocompleteIndex].getAttribute('data-code');
                selectAutocomplete(code);
                return true;
            }
            return false;
        }

        // ---------- Lazy rendering: дозареждане при скрол ----------
        function setupLazyScroll() {
            const grid = document.getElementById('productsGrid');
            grid.addEventListener('scroll', () => {
                if (renderedCount >= filteredProducts.length) return;
                const nearBottom = grid.scrollTop + grid.clientHeight >= grid.scrollHeight - 200;
                if (nearBottom) {
                    renderMoreProducts();
                }
            });
        }

        function renderMoreProducts() {
            const grid = document.getElementById('productsGrid');
            const next = filteredProducts.slice(renderedCount, renderedCount + RENDER_BATCH);
            if (next.length === 0) return;
            const html = next.map(buildProductCardHtml).join('');
            grid.insertAdjacentHTML('beforeend', html);
            renderedCount += next.length;
        }
        
        // ==================== ГОРЕЩИ КЛАВИШИ ====================
        document.addEventListener('keydown', function(e) {
            const codeInput = document.getElementById('quickCodeInput');
            const dropdown = document.getElementById('autocompleteDropdown');
            const isAutocompleteOpen = dropdown && dropdown.classList.contains('active');

            if (e.ctrlKey && e.key === 'k') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            } else if (e.ctrlKey && e.key === 'b') {
                e.preventDefault();
                codeInput.focus();
            } else if (document.activeElement === codeInput && isAutocompleteOpen) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateAutocomplete(1);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateAutocomplete(-1);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!confirmAutocomplete()) {
                        addProductByCode();
                    }
                } else if (e.key === 'Escape') {
                    dropdown.classList.remove('active');
                }
            } else if (e.key === 'Enter' && document.activeElement === codeInput) {
                addProductByCode();
            }
        });
        
        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        document.addEventListener('DOMContentLoaded', function() {
            loadTheme();
            applyView(viewMode);
            setupLazyScroll();

            // Autocomplete listener
            const codeInput = document.getElementById('quickCodeInput');
            codeInput.addEventListener('input', handleCodeAutocomplete);
            codeInput.addEventListener('focus', handleCodeAutocomplete);

            // Затваряй autocomplete при клик навън
            document.addEventListener('click', function(e) {
                const dropdown = document.getElementById('autocompleteDropdown');
                const group = codeInput.closest('.code-input-group');
                if (dropdown && group && !group.contains(e.target)) {
                    dropdown.classList.remove('active');
                }
            });

            loadCartFromLocalStorage();
            loadProductsFromGoogleSheets();

            window.onclick = function(event) {
                const cartModal = document.getElementById('cartModal');
                const historyModal = document.getElementById('historyModal');

                if (event.target === cartModal) {
                    closeCartModal();
                }
                if (event.target === historyModal) {
                    closeHistoryModal();
                }
            };
        });
    </script>
</body>
</html>
